<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숙주 - 기생체 환생기</title>
<style>
:root{--bg:#e9efe4;--fg:#1c2b22;--card:#fbfdf8;--ac:#7a2f9e;--mu:#5d6e62;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1511;--fg:#e4eee6;--card:#18211b;--ac:#c58bea;--mu:#93a698}}
:root[data-theme="dark"]{--bg:#0f1511;--fg:#e4eee6;--card:#18211b;--ac:#c58bea;--mu:#93a698}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px;box-sizing:border-box}
#w{position:relative;width:100%;max-width:820px}
canvas{width:100%;display:block;border-radius:10px;touch-action:none;background:#2d4a33}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,18,12,.82);border-radius:10px;color:#eef6ee;text-align:center;padding:16px;overflow:auto}
#ov h1{margin:0;font-size:clamp(24px,5vw,38px)}

.g b{display:block}.g span{font-size:12px;color:var(--mu)}
#bt{display:flex;gap:10px}

</style></head><body>
<div id="w"><canvas id="c" width="800" height="500"></canvas><div id="ov"></div></div>
<div id="bt"><button id="ba">공격 (Space)</button><button id="bh">홈</button><button id="bs">스킬 (Q)</button><button id="bj">갈아타기 (E)</button></div>
<div id="h">이동: WASD / 방향키 / 화면 터치 · 공격: Space · 다른 숙주로 이동: E</div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),ov=document.getElementById('ov'),W=800,H=500;
const T={rabbit:{n:'토끼',r:8,s:150,h:30,a:5,c:'#e3d6b8'},deer:{n:'사슴',r:11,s:115,h:60,a:9,c:'#c08a55'},bear:{n:'곰',r:15,s:85,h:120,a:20,c:'#6e4d3c'},wolf:{n:'늑대',r:10,s:110,h:40,a:7,c:'#8d3b3b'},boar:{n:'멧돼지',r:12,s:100,h:75,a:12,c:'#8a6a4a'},tiger:{n:'호랑이',r:13,s:135,h:90,a:18,c:'#e08a2e'},elephant:{n:'코끼리',r:20,s:70,h:220,a:30,c:'#9aa3ad'},dragon:{n:'용',r:17,s:125,h:180,a:35,c:'#3fb58a'},alpha:{n:'우두머리 늑대',r:14,s:125,h:120,a:14,c:'#5a1f2a'},boss:{n:'포식왕',r:30,s:95,h:600,a:25,c:'#4a1a5e'}};
const GN=[['cdr','각성 유전자','스킬 재사용 -12%'],['spd','질주 유전자','이동속도 +10%'],['hp','강골 유전자','최대 체력 +15%'],['atk','맹독 유전자','공격력 +15%'],['drain','공생 유전자','체력 소모 -12%'],['gain','포식 유전자','회복량 +20%']];
let wm=0,par=null,pl=0,WW=1600,WH=1000,cx=0,cy=0,boss=null,bossT=40,bossN=0,gene,gen=1,best=0,mode='start',L,B,P,time,dna,kills,keys={},tgt=null,swT=0,wolfT=0,fl=[],last=0;
gene={spd:0,hp:0,atk:0,drain:0,gain:0,cdr:0};
const R=(a,b)=>a+Math.random()*(b-a),D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function mk(t,h,ed){let o={t,x:R(30,WW-30),y:R(30,WH-30),hp:T[t].h,cd:0,a:R(0,6.28),h,host:0,hit:0};
 if(ed&&mode=='play'&&P){const a=R(0,6.28);o.x=Math.max(10,Math.min(WW-10,P.x+Math.cos(a)*450));o.y=Math.max(10,Math.min(WH-10,P.y+Math.sin(a)*450))}return o}
const M=o=>o.mh||T[o.t].h*(o==P?(1+.15*gene.hp)*(wm?2:1):1);
const sc=()=>Math.floor(time)+dna;
const SK={wolf:['하울링',9],rabbit:['질주',6],deer:['치유',14],bear:['포효',10],boar:['돌진',7],tiger:['급습',8],elephant:['지진',12],dragon:['화염',9]};
function dmg(o,d){if(!L.includes(o))return;o.hp-=d;o.hit=.15;if(o.hp>0)return;L.splice(L.indexOf(o),1);
 if(o.h){const v=o.t=='boss'?100:o.t=='alpha'?30:10;kills++;dna+=v;P.hp=Math.min(M(P),P.hp+(v>=30?20:8)*(1+.2*gene.gain));say('+'+v+' DNA');if(o==boss){boss=null;bossN++;bossT=50;P.hp=M(P);say('보스 처치! 체력 완전 회복')}}
 else{dna+=2;P.hp=Math.min(M(P),P.hp+14*(1+.2*gene.gain));say('섭취 +체력')}}
function area(r,d,st){for(const o of L.slice()){if(o==P||D(o,P)>r+T[o.t].r)continue;const k=D(o,P)||1;o.x+=(o.x-P.x)/k*30;o.y+=(o.y-P.y)/k*30;if(st&&o.t!='boss')o.stun=st;if(d)dmg(o,d)}P.ring=.4;P.rr=r}
function skill(){if(mode!='play'||P.sk>0)return;const t=P.t,a=T[t].a*(1+.15*gene.atk),fx=P.fx||1,fy=P.fy||0,s=SK[t];if(!s)return;
 P.sk=s[1]*Math.pow(.88,gene.cdr);say(s[0]+'!');
 if(t=='rabbit')P.boost=1.3;
 else if(t=='deer'){P.hp=Math.min(M(P),P.hp+M(P)*.35)}
 else if(t=='bear')area(140,a*.5,2.2);
 else if(t=='boar'){P.dsh=.35;P.ddx=fx;P.ddy=fy;P.dtag=(P.dtag||0)+1}
 else if(t=='tiger'){P.x+=fx*140;P.y+=fy*140;area(60,a*2.5,0)}
 else if(t=='wolf')area(170,a*.8,2.2);
 else if(t=='elephant')area(160,a*1.2,1.5);
 else if(t=='dragon')area(130,a*2.5,0)}
function newPar(){const c=L.filter(o=>!o.h&&o!=P&&D(o,P)>350);let b=c.length?c[Math.floor(R(0,c.length))]:null;if(!b){b=mk(pickN(),0,1);L.push(b)}b.par=1;b.mh=T[b.t].h*(1+.2*pl);b.hp=b.mh;b.jc=3;par=b}
function parAI(o,dt){o.jc-=dt;const d=D(o,P),s=T[o.t].s*Math.min(1.05,.8+.03*pl);
 if(o.jc<=0&&(d<80||o.hp<o.mh*.35)){let b=null,bd=110;for(const q of L)if(q!=o&&q!=P&&!q.h&&D(q,o)<bd){bd=D(q,o);b=q}
  if(b){const ra=o.hp/o.mh;o.par=0;o.mh=0;o.hp=Math.min(o.hp,T[o.t].h);b.par=1;b.mh=T[b.t].h*(1+.2*pl);b.hp=Math.min(b.mh,(ra+.25)*b.mh);b.jc=3;par=b;say('기생체가 갈아탐!');return}}
 if(d<340){let vx=o.x-P.x,vy=o.y-P.y;const n0=Math.hypot(vx,vy)||1;vx/=n0;vy/=n0;if(o.x<110)vx+=1.5;if(o.x>WW-110)vx-=1.5;if(o.y<110)vy+=1.5;if(o.y>WH-110)vy-=1.5;const n=Math.hypot(vx,vy)||1;o.x+=vx/n*s*dt;o.y+=vy/n*s*dt}
 else{o.a+=R(-1,1)*dt*3;o.x+=Math.cos(o.a)*s*.4*dt;o.y+=Math.sin(o.a)*s*.4*dt}
 o.x=Math.max(8,Math.min(WW-8,o.x));o.y=Math.max(8,Math.min(WH-8,o.y));
 if(d<T[o.t].r+T[P.t].r+4&&o.cd<=0){o.cd=1.2;const dm=Math.round(T[o.t].a*.6);P.hp-=dm;P.hit=.2;say('-'+dm)}}
function pickN(){const p=['rabbit','rabbit','deer','deer','bear'];if(gen>=2)p.push('boar','tiger');if(gen>=3)p.push('elephant');if(gen>=5)p.push('dragon');return p[Math.floor(R(0,p.length))]}
function start(){L=[];B=[];time=0;dna=0;kills=0;wolfT=4;fl=[];boss=null;bossT=40;par=null;pl=0;
 for(let i=0;i<20;i++)L.push(mk(pickN(),0));
 for(let i=0;i<(wm?0:4);i++)L.push(mk('wolf',1,1));
 for(let i=0;i<(wm?0:18);i++)B.push({x:R(20,WW-20),y:R(20,WH-20)});
 if(wm){P=mk('wolf',1);P.x=WW/2;P.y=WH/2;L.push(P)}else P=L[Math.floor(R(0,20))];P.host=1;P.hp=M(P);mode='play';ov.style.display='none';say('세대 '+gen+' 시작')}
function say(t){fl.push({t,l:2.2})}
function die(){best=Math.max(best,sc());mode='gene';
 let c=GN.slice().sort(()=>Math.random()-.5).slice(0,3);
 ov.style.display='flex';
 ov.innerHTML='<h1>'+(wm?'늑대 쓰러짐':'숙주 사망')+'</h1><p>생존 '+Math.floor(time)+'초 · 처치 '+kills+' · 점수 '+sc()+' (최고 '+best+')<br>환생하며 물려받을 유전자를 고르세요.</p><div class="row">'+
 c.map(g=>'<button class="g" data-k="'+g[0]+'"><b>'+g[1]+' Lv.'+gene[g[0]]+'→'+(gene[g[0]]+1)+'</b><span>'+g[2]+'</span></button>').join('')+'</div>';
 ov.querySelectorAll('.g').forEach(b=>b.onclick=()=>{gene[b.dataset.k]++;gen++;start()})}
function intro(){ov.style.display='flex';ov.innerHTML='<h1>숙주</h1><p>당신은 생명체에 기생하는 작은 기생체입니다. 숙주를 조종해 열매를 먹고 늑대를 물리치세요. 숙주는 시간이 지날수록 쇠약해지고, 죽으면 더 강한 유전자를 얻어 환생합니다. 위험할 땐 다른 동물로 갈아타세요.</p><button id="go">첫 숙주에 침투</button><p>늑대 모드: 늑대가 되어 도망치는 기생체의 숙주를 사냥하세요. 하울링(Q)으로 기절시키고 물어뜯으면 됩니다. 쓰러뜨릴 때마다 기생체는 더 강한 숙주로 환생해요.</p><button id="gw">늑대 모드 시작</button>';document.getElementById('go').onclick=()=>{wm=0;start()};document.getElementById('gw').onclick=()=>{wm=1;start()}}
function atk(){if(mode!='play'||P.cd>0)return;P.cd=.4;P.sw=.15;
 const dm=T[P.t].a*(1+.15*gene.atk)*(wm?1.6:1);
 for(const o of L.slice()){if(o==P||D(o,P)>T[P.t].r+T[o.t].r+22)continue;
  o.hp-=dm;o.hit=.15;const d=D(o,P)||1;o.x+=(o.x-P.x)/d*14;o.y+=(o.y-P.y)/d*14;
  if(o.hp<=0){L.splice(L.indexOf(o),1);
   if(o.h){const v=o.t=='boss'?100:o.t=='alpha'?30:10;kills++;dna+=v;P.hp=Math.min(M(P),P.hp+(v>=30?20:8)*(1+.2*gene.gain));say('+'+v+' DNA');if(o==boss){boss=null;bossN++;bossT=50;P.hp=M(P);say('보스 처치! 체력 완전 회복')}}
   else{dna+=2;P.hp=Math.min(M(P),P.hp+14*(1+.2*gene.gain));say('섭취 +체력')}}}}
function jump(){if(mode!='play'||wm)return;let b=null,bd=70;
 for(const o of L)if(o!=P&&!o.h){const d=D(o,P);if(d<bd){bd=d;b=o}}
 if(!b){say('근처에 숙주가 없음');return}
 const ra=b.hp/T[b.t].h;P.hp=Math.min(P.hp/M(P)*T[P.t].h,T[P.t].h);P.host=0;
 P=b;b.host=1;b.sk=3;b.hp=Math.max(6,ra*M(b));say(T[b.t].n+'(으)로 갈아탐');}
function upd(dt){
 time+=dt;P.cd-=dt;P.sw-=dt;P.sk-=dt;P.boost-=dt;P.ring-=dt;
 if(wm&&(!par||!L.includes(par))){if(par){kills++;dna+=50;pl++;P.hp=Math.min(M(P),P.hp+M(P)*.5);say('기생체 숙주 격파! +50 DNA')}newPar()}bossT-=dt;if(!wm&&!boss&&bossT<=0){boss=mk('boss',1,1);boss.mh=T.boss.h+gen*120+bossN*150;boss.hp=boss.mh;L.push(boss);say('보스 출현! 포식왕')}
 let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);
 if(tgt){const ex=tgt.x-P.x,ey=tgt.y-P.y;if(Math.hypot(ex,ey)>8){dx=ex;dy=ey}}
 const m=Math.hypot(dx,dy);const sp=T[P.t].s*(1+.1*gene.spd)*(P.boost>0?2.2:1)*(wm?1.2:1);
 if(m){P.fx=dx/m;P.fy=dy/m;P.x+=dx/m*sp*dt;P.y+=dy/m*sp*dt}
 if(P.dsh>0){P.dsh-=dt;P.x+=P.ddx*sp*3.5*dt;P.y+=P.ddy*sp*3.5*dt;const a=T[P.t].a*(1+.15*gene.atk);for(const o of L.slice())if(o!=P&&o.dtag!=P.dtag&&D(o,P)<T[P.t].r+T[o.t].r+6){o.dtag=P.dtag;dmg(o,a*2.2);o.x+=P.ddx*20;o.y+=P.ddy*20}}
 P.x=Math.max(8,Math.min(WW-8,P.x));P.y=Math.max(8,Math.min(WH-8,P.y));
 P.hp-=(3+time/40)*Math.pow(.88,gene.drain)*(wm?.5:1)*dt;
 P.hp=Math.min(P.hp,M(P));
 for(const b of B)if(D(b,P)<T[P.t].r+7){P.hp=Math.min(M(P),P.hp+18*(1+.2*gene.gain));b.x=R(20,WW-20);b.y=R(20,WH-20);dna+=1}
 wolfT-=dt;const cap=3+gen;
 if(!wm&&wolfT<=0){wolfT=Math.max(2.5,9-gen*.6-time/25);if(L.filter(o=>o.h).length<cap){const al=gen>=2&&Math.random()<.25;L.push(mk(al?'alpha':'wolf',1,1));if(al)say('우두머리 늑대 출현!')}}
 if(Math.random()<dt*.35&&L.filter(o=>!o.h&&o!=P).length<18)L.push(mk(pickN(),0,1));
 for(const o of L){if(o==P)continue;o.cd-=dt;o.hit-=dt;if((o.stun-=dt)>0)continue;if(o.par){parAI(o,dt);continue}const s=T[o.t].s;let vx=0,vy=0,k=.5;
 if(o.t=='boss'){o.bt=(o.bt||0)+dt;
  if(o.ch>0){o.ch-=dt;if(o.ch<=0){o.dash=.5;const n=Math.hypot(P.x-o.x,P.y-o.y)||1;o.dx=(P.x-o.x)/n;o.dy=(P.y-o.y)/n}continue}
  if(o.dash>0){o.dash-=dt;o.x=Math.max(8,Math.min(WW-8,o.x+o.dx*s*3.2*dt));o.y=Math.max(8,Math.min(WH-8,o.y+o.dy*s*3.2*dt));if(D(o,P)<T.boss.r+T[P.t].r&&o.cd<=0){o.cd=.9;const dm=Math.round(T.boss.a*1.6);P.hp-=dm;P.hit=.2;say('-'+dm)}continue}
  if(o.bt>5){o.bt=0;o.ch=.7;say('보스 돌진!')}
  if(!o.sm&&o.hp<M(o)/2){o.sm=1;for(let i=0;i<3;i++){const w=mk('wolf',1);w.x=o.x+R(-60,60);w.y=o.y+R(-60,60);L.push(w)}say('보스가 늑대를 소환!')}}
  if(o.h){const d=D(o,P);if(d<340){vx=P.x-o.x;vy=P.y-o.y;k=1;
    if(d<T[o.t].r+T[P.t].r+4&&o.cd<=0){o.cd=.9;P.hp-=T[o.t].a;P.hit=.2;say('-'+T[o.t].a)}}
   else{o.a+=R(-1,1)*dt*3;vx=Math.cos(o.a);vy=Math.sin(o.a)}}
  else{let w=null,wd=130;for(const q of L)if(q.h){const d=D(q,o);if(d<wd){wd=d;w=q}}
   if(w){vx=o.x-w.x;vy=o.y-w.y;k=1}else{o.a+=R(-1,1)*dt*3;vx=Math.cos(o.a);vy=Math.sin(o.a);k=.35}}
  const n=Math.hypot(vx,vy)||1;o.x+=vx/n*s*k*dt;o.y+=vy/n*s*k*dt;
  if(o.x<8||o.x>WW-8||o.y<8||o.y>WH-8){o.a+=3;o.x=Math.max(8,Math.min(WW-8,o.x));o.y=Math.max(8,Math.min(WH-8,o.y))}}
 fl.forEach(f=>f.l-=dt);fl=fl.filter(f=>f.l>0);
 if(P.hp<=0)die()}
function sh(c,a){const n=parseInt(c.slice(1),16),t=a<0?0:255,p=Math.abs(a),f=v=>Math.round(v+(t-v)*p);return'rgb('+f(n>>16)+','+f(n>>8&255)+','+f(n&255)+')'}
function body(o){const r=T[o.t].r,t=o.t,F=o.hit>0,C=a=>F?'#fff':sh(T[t].c,a||0);
 if(o.px!==undefined){if(Math.hypot(o.x-o.px,o.y-o.py)>.15){o.face=Math.atan2(o.y-o.py,o.x-o.px);o.ph=(o.ph||0)+.3}}
 o.px=o.x;o.py=o.y;const ph=o.ph||0,w=Math.sin(ph)*r*.22;
 x.save();x.translate(o.x,o.y);
 if(o.h){x.fillStyle='rgba(220,50,50,.22)';x.beginPath();x.arc(0,0,r+7,0,7);x.fill()}
 x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.ellipse(0,r*.3,r*1.2,r*.8,0,0,7);x.fill();
 x.rotate(o.face||0);x.lineCap='round';
 const E=(cx,cy,rx,ry,f,rt)=>{x.fillStyle=f;x.beginPath();x.ellipse(cx,cy,rx,ry,rt||0,0,7);x.fill()};
 const eyes=(hx,hr,col)=>{E(hx+hr*.25,-hr*.45,hr*.17,hr*.17,col);E(hx+hr*.25,hr*.45,hr*.17,hr*.17,col)};
 const legs=(lx,ly,lr,c)=>{for(const [a,b,s] of [[lx,-ly,1],[lx,ly,-1],[-lx,-ly,-1],[-lx,ly,1]])E(a+w*s,b,lr*1.3,lr,c)};
